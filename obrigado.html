<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Contato enviado | AUDIUS</title>
  <meta name="description" content="Recebemos seu contato. A equipe da AUDIUS poderá falar com você em breve." />
  <link rel="icon" type="image/svg+xml" href="./assets-v3/favicon-audius.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
  <style>
    :root{font-family:"Bricolage Grotesque",Arial,sans-serif;color:#121212;background:#fff5f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    header,footer{width:min(100% - 40px,1120px);margin-inline:auto}
    header{padding:32px 0}
    header img{width:150px;height:auto}
    main{flex:1;display:grid;place-items:center;padding:48px 20px 96px}
    .card{width:min(100%,680px);padding:clamp(32px,6vw,72px);background:#fff;border:1px solid #ffd5cb;border-radius:32px;box-shadow:0 24px 48px -24px #502b1e30;text-align:center}
    .check{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 32px;border-radius:50%;background:#e1f4c2;color:#54821f;font-size:38px;font-weight:700;line-height:1}
    h1{margin:0;font-size:clamp(2.5rem,6vw,4rem);font-weight:500;line-height:1.08;letter-spacing:-.02em}
    p{max-width:42ch;margin:24px auto 36px;color:#3d3d3d;font-size:1.125rem;line-height:1.55}
    a.button{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 28px;border-radius:999px;background:#fb4616;color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;text-decoration:none;text-transform:uppercase}
    a.button:hover{background:#d33808}
    a.button:focus-visible{outline:3px solid #8bc53f;outline-offset:3px}
    footer{padding:0 0 32px;color:#5a5a5a;font-size:14px;text-align:center}
  </style>
</head>
<body>
  <header><a href="./" aria-label="AUDIUS, voltar ao início"><img src="./assets-v3/logo/audius-coral.png" alt="AUDIUS" /></a></header>
  <main>
    <div class="card">
      <span class="check" aria-hidden="true">✓</span>
      <h1>Recebemos seu contato.</h1>
      <p>Obrigado por falar com a AUDIUS. Nossa equipe poderá entrar em contato pelo telefone informado.</p>
      <a class="button" href="./">Voltar ao início</a>
    </div>
  </main>
  <footer>AUDIUS · Goiânia, GO</footer>
</body>
</html>
